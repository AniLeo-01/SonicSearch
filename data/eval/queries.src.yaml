# Golden query set - SOURCE (human-authored).  Run `uv run python scripts/label_helper.py` to regenerate
# data/eval/queries.yaml, which stores audio-time intervals + verbatim quotes (what the evaluator uses).
#
# Authoring protocol (see docs/EVALUATION.md):
#   * queries were written by reading the transcripts BEFORE any retrieval tuning, then frozen;
#   * relevance is exhaustive per query: every moment in the corpus that answers the query is listed;
#   * references are utterance ranges "file:first-last" (inclusive); "@1" marks partial relevance
#     (default grade 2 = directly relevant);
#   * speaker-scoped queries are labelled with the TRUE speaker (from NASA's human transcript), even
#     where our diarization is wrong - so diarization errors show up as retrieval misses, honestly;
#   * split: every third query of each category is "dev" (tuning allowed), the rest are "test".
version: 1
tolerance_sec: 5.0
description: >-
  81 queries over 6 two-speaker NASA interviews (56 min). Categories probe exact terms, quoted phrases,
  paraphrases, natural-language questions, multi-file topics, misspelled or ASR-mangled terms, and
  role-scoped (host/guest) search.
queries:
