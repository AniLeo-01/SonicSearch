# Golden audio dataset manifest.
#
# Six ~9.3-minute excerpts of NASA "Houston We Have a Podcast" (HWHAP) interviews.
# Selection rules (see docs/DATASET.md for the rationale):
#   * exactly two speakers in the excerpt (host + guest), verified against NASA's human transcript
#   * no speaker appears in more than one file (6 distinct hosts, 6 distinct guests)
#   * 6 distinct topics, with deliberate cross-file "confusers" (e.g. brain navigation vs clock navigation)
#   * excerpt starts at the first conversational turn after the intro music, ends on a sentence boundary
#
# License: NASA audio and transcripts are US Government works and generally not subject to copyright
# in the United States (https://www.nasa.gov/nasa-brand-center/images-and-media/). Use does not imply
# NASA endorsement. Offsets below let `scripts/build_dataset.py` rebuild every file from the source.
dataset: nasa-hwhap-two-speaker-v1
source_feed: https://www.nasa.gov/feeds/podcasts/houston-we-have-a-podcast
